<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6a11cb">
<meta name="description" content="لعبة تعليمية للأطفال لتعلّم الحروف العربية والإنجليزية بالنطق والكتابة والألعاب">
<title>🎈 لعبة الحروف - Letters Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
  background: linear-gradient(135deg, #6a11cb 0%, #2575fc 55%, #00c6ff 100%);
  background-attachment: fixed;
  display: flex; align-items: center; justify-content: center;
  padding: 14px; min-height: 100vh; color: #2b2b45;
}
button { font-family: inherit; }
#app {
  width: 100%; max-width: 780px;
  background: #fff; border-radius: 30px;
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
  padding: 22px; min-height: 640px;
  position: relative; overflow: hidden;
}
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

h1 {
  font-size: 38px; margin: 10px 0 4px; text-align: center; font-weight: 900;
  background: linear-gradient(90deg, #6a11cb, #2575fc, #00c6ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
h2 { text-align: center; font-size: 26px; margin: 8px 0 4px; color: #4a3f8f; }
.sub { text-align: center; color: #8a8aa3; font-size: 16px; margin: 0 0 10px; }

/* ---------- شريط الإعدادات ---------- */
.tools {
  display: flex; justify-content: center; align-items: center; gap: 10px;
  flex-wrap: wrap; margin: 8px 0 4px;
}
.tool-btn {
  border: 2px solid #e3e5ff; background: #f8f9ff; color: #4a3f8f;
  border-radius: 14px; padding: 8px 14px; font-size: 18px; font-weight: 800;
  cursor: pointer; transition: .15s; min-width: 52px;
}
.tool-btn:hover { background: #eef1ff; }
.tool-btn.off { opacity: .55; }
.tool-btn.on { background: #e1f7e7; border-color: #34c759; }
.stars-badge {
  background: linear-gradient(135deg, #fff3b0, #ffd84d); color: #7a5600;
  border-radius: 14px; padding: 8px 16px; font-weight: 900; font-size: 18px;
}
.install-btn {
  display: block; margin: 12px auto 0; border: none; border-radius: 16px;
  padding: 12px 22px; font-size: 17px; font-weight: 800; color: #fff; cursor: pointer;
  background: linear-gradient(135deg, #11998e, #38ef7d);
  box-shadow: 0 6px 16px rgba(17,153,142,.35);
}
.install-btn[hidden] { display: none; }

/* ---------- الشاشة الرئيسية ---------- */
.lang-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 30px; }
.big-btn {
  border: none; border-radius: 26px; padding: 34px 10px;
  font-size: 24px; font-weight: 800; cursor: pointer; color: #fff;
  transition: .2s; box-shadow: 0 10px 24px rgba(0,0,0,.18);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.big-btn span.flag { font-size: 46px; }
.big-btn:hover { transform: translateY(-5px) scale(1.02); }
.big-btn:active { transform: scale(.96); }
.big-btn.ar { background: linear-gradient(135deg, #00b09b, #96c93d); }
.big-btn.en { background: linear-gradient(135deg, #f7971e, #ffd200); color: #5a3d00; }

/* ---------- القائمة ---------- */
.menu-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
.menu-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; margin: 8px 0; padding: 16px 22px;
  font-size: 20px; font-weight: 700; border: none; border-radius: 20px;
  cursor: pointer; color: #fff; transition: .2s; text-align: start;
  box-shadow: 0 7px 18px rgba(0,0,0,.15);
}
.menu-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.22); }
.menu-btn:active { transform: scale(.98); }
.menu-btn .ico { font-size: 28px; }
.m-learn { background: linear-gradient(135deg, #667eea, #764ba2); }
.m-speak { background: linear-gradient(135deg, #ee0979, #ff6a00); }
.m-write { background: linear-gradient(135deg, #0ba360, #3cba92); }
.m-practice { background: linear-gradient(135deg, #11998e, #38ef7d); }
.m-quiz { background: linear-gradient(135deg, #f7971e, #ff6b6b); }
.m-memory { background: linear-gradient(135deg, #4776e6, #8e54e9); }
.m-progress { background: linear-gradient(135deg, #8e9eab, #667db6); }
@media (min-width: 640px) {
  .menu-grid { grid-template-columns: 1fr 1fr; column-gap: 14px; }
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 10px;
}
.back-btn {
  border: none; background: #eef0ff; color: #4a3f8f;
  padding: 10px 18px; border-radius: 14px; font-size: 16px;
  font-weight: 700; cursor: pointer; transition: .2s;
}
.back-btn:hover { background: #dfe3ff; }
.hud {
  background: #f3f4ff; color: #4a3f8f; font-weight: 800;
  padding: 10px 18px; border-radius: 14px; font-size: 16px;
}

/* ---------- بطاقات الحروف ---------- */
.letter-card {
  background: linear-gradient(135deg, #eef2ff, #fce7f3);
  border-radius: 28px; padding: 14px; text-align: center;
  margin-bottom: 14px; position: relative; cursor: pointer;
  transition: .2s; box-shadow: inset 0 0 0 3px #fff;
}
.letter-card:hover { transform: scale(1.01); }
.letter-big {
  font-size: 120px; font-weight: 900; line-height: 1.15;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  display: inline-block; user-select: none;
}
.letter-name { font-size: 18px; font-weight: 800; color: #8a7fc4; min-height: 24px; }
.word-card {
  background: linear-gradient(135deg, #fff7e6, #ffe9f3);
  border-radius: 28px; padding: 16px; text-align: center;
  cursor: pointer; transition: .2s; box-shadow: inset 0 0 0 3px #fff;
  margin-bottom: 16px;
}
.word-card:hover { transform: scale(1.01); }
.word-emoji { font-size: 68px; line-height: 1.1; }
.word-text { font-size: 34px; font-weight: 800; color: #d6336c; margin-top: 4px; }
.word-text.en { direction: ltr; color: #1b6ca8; }
.nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nav-btn {
  border: none; border-radius: 18px; padding: 16px;
  font-size: 19px; font-weight: 800; cursor: pointer;
  color: #fff; background: linear-gradient(135deg, #667eea, #764ba2);
  transition: .2s; box-shadow: 0 6px 16px rgba(102,126,234,.4);
}
.nav-btn:hover { transform: translateY(-3px); }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.nav-btn.green { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 6px 16px rgba(17,153,142,.35); }
.nav-btn.gray { background: linear-gradient(135deg, #8e9eab, #667db6); box-shadow: 0 6px 16px rgba(102,125,182,.35); }
.nav-btn.red { background: linear-gradient(135deg, #ee0979, #ff6a00); box-shadow: 0 6px 16px rgba(238,9,121,.3); }
.speak-hint { text-align: center; color: #9a9ab5; font-size: 14px; margin-top: 10px; }

/* شريط الحروف السريع */
.strip {
  display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 10px;
  margin-bottom: 12px; scrollbar-width: thin;
}
.strip-btn {
  flex: 0 0 auto; min-width: 46px; height: 46px; border-radius: 14px;
  border: 2px solid #e3e5ff; background: #f8f9ff; color: #4a3f8f;
  font-size: 22px; font-weight: 800; cursor: pointer; direction: ltr;
}
.strip-btn.done { background: #e1f7e7; border-color: #9be3b0; }
.strip-btn.cur { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-color: transparent; }

/* ---------- المايكروفون ---------- */
.mic-row { display: flex; justify-content: center; margin: 14px 0 4px; }
.mic-btn {
  border: none; border-radius: 50%;
  width: 88px; height: 88px;
  background: linear-gradient(135deg, #ee0979, #ff6a00);
  color: #fff; font-size: 40px;
  cursor: pointer; transition: .2s;
  box-shadow: 0 8px 22px rgba(238,9,121,.4);
  display: flex; align-items: center; justify-content: center;
}
.mic-btn:hover:not(:disabled) { transform: scale(1.06); }
.mic-btn:active:not(:disabled) { transform: scale(.94); }
.mic-btn:disabled { opacity: .5; cursor: not-allowed; }
.mic-btn.listening {
  animation: pulse 1.2s infinite;
  background: linear-gradient(135deg, #ff3b30, #ee0979);
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(238,9,121,.7); }
  70% { box-shadow: 0 0 0 22px rgba(238,9,121,0); }
  100% { box-shadow: 0 0 0 0 rgba(238,9,121,0); }
}
.mic-hint {
  text-align: center; font-size: 15px; color: #6b6b8a;
  margin-top: 6px; font-weight: 700; min-height: 22px;
}
.mic-hint.ok { color: #1fa84e; }
.mic-hint.no { color: #e02424; }
.mic-hint.listen { color: #ee0979; }
.heard-box { text-align: center; margin-top: 6px; font-size: 15px; color: #6b6b8a; min-height: 20px; }
.heard-box b { color: #4a3f8f; }
.warn-box {
  background: #fff4e5; color: #a05a00;
  border: 2px solid #ffd48a; border-radius: 16px;
  padding: 12px 16px; margin: 10px 0; font-size: 14px;
  text-align: center; font-weight: 700;
}
.warn-box[hidden] { display: none; }

/* ---------- الكتابة ---------- */
.write-wrap {
  position: relative; width: 100%; height: 300px; border-radius: 26px;
  background:
    repeating-linear-gradient(0deg, transparent 0 74px, #e7e9ff 74px 76px),
    linear-gradient(135deg, #fbfbff, #fff7fb);
  box-shadow: inset 0 0 0 3px #eef0ff; overflow: hidden; margin-bottom: 12px;
}
.write-guide {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 190px; font-weight: 900; color: rgba(106,17,203,.16);
  user-select: none; pointer-events: none; line-height: 1.7; direction: ltr;
}
#write-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.colors { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
.color-dot {
  width: 38px; height: 38px; border-radius: 50%; border: 4px solid #fff;
  box-shadow: 0 0 0 2px #d9dbf5; cursor: pointer;
}
.color-dot.sel { box-shadow: 0 0 0 4px #4a3f8f; }

/* ---------- لعبة الذاكرة ---------- */
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 8px; }
.mem-card {
  position: relative; aspect-ratio: 1 / 1.05; border: none; padding: 0;
  background: transparent; cursor: pointer; perspective: 600px;
}
.mem-card .face {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  border-radius: 18px; backface-visibility: hidden; transition: transform .4s;
  font-weight: 900; box-shadow: 0 5px 12px rgba(0,0,0,.14);
}
.mem-card .front { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 34px; }
.mem-card .back {
  background: #fff; transform: rotateY(180deg); border: 3px solid #e3e5ff;
  font-size: 40px; direction: ltr;
}
.mem-card .back.kind-l { color: #4a3f8f; font-size: 44px; }
.mem-card.flipped .front, .mem-card.matched .front { transform: rotateY(180deg); }
.mem-card.flipped .back, .mem-card.matched .back { transform: rotateY(0); }
.mem-card.matched .back { background: #d9f8dd; border-color: #34c759; }

/* ---------- الأسئلة ---------- */
.question-text {
  text-align: center; font-size: 22px; font-weight: 800;
  color: #4a3f8f; margin: 6px 0 14px; line-height: 1.5;
}
.question-text .en-line {
  display: block; font-size: 15px; color: #9a9ab5; font-weight: 600; direction: ltr;
}
.prompt-area {
  background: linear-gradient(135deg, #eef2ff, #fce7f3);
  border-radius: 26px; padding: 18px; text-align: center;
  cursor: pointer; transition: .2s; margin-bottom: 16px;
  box-shadow: inset 0 0 0 3px #fff;
}
.prompt-area:hover { transform: scale(1.01); }
.prompt-emoji { font-size: 74px; line-height: 1.1; }
.prompt-word { font-size: 34px; font-weight: 800; color: #d6336c; }
.prompt-word.en { direction: ltr; color: #1b6ca8; }
.prompt-letter {
  font-size: 104px; font-weight: 900; line-height: 1.15;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.opt {
  border: 3px solid #e3e5ff; background: #f8f9ff;
  border-radius: 20px; padding: 16px 10px; cursor: pointer;
  font-weight: 800; color: #2b2b45; transition: .16s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; min-height: 88px;
}
.opt:hover:not(:disabled) { transform: translateY(-4px); border-color: #a5b4ff; background: #eef1ff; }
.opt:disabled { cursor: default; }
.letter-opt { font-size: 44px; direction: ltr; }
.word-opt .opt-emoji { font-size: 38px; line-height: 1; }
.word-opt .opt-word { font-size: 20px; }
.opt.correct { background: #d9f8dd !important; border-color: #34c759 !important; animation: pop .35s ease; }
.opt.wrong { background: #ffe0e0 !important; border-color: #ff3b30 !important; animation: shake .35s ease; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.feedback { text-align: center; font-size: 22px; font-weight: 800; margin-top: 14px; min-height: 32px; }
.feedback.ok { color: #1fa84e; }
.feedback.no { color: #e02424; }

/* ---------- النتائج والإنجازات ---------- */
.result-box { text-align: center; padding: 18px 6px; }
.result-stars { font-size: 58px; letter-spacing: 8px; min-height: 70px; }
.result-score {
  font-size: 46px; font-weight: 900; margin: 12px 0;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.result-msg { font-size: 22px; font-weight: 700; color: #4a3f8f; margin-bottom: 22px; }
.prog-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 14px; }
.prog-card {
  background: #f3f4ff; border-radius: 18px; padding: 12px; text-align: center;
}
.prog-card b { display: block; font-size: 26px; color: #4a3f8f; }
.prog-card span { font-size: 13px; color: #8a8aa3; font-weight: 700; }
.prog-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 14px; direction: ltr; }
.prog-cell {
  aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: #f1f2fb; color: #b4b6d0; font-weight: 800; font-size: 20px;
}
.prog-cell.learned { background: #e1f7e7; color: #1fa84e; }
.prog-cell.written { box-shadow: inset 0 0 0 3px #ffd84d; }
.legend { text-align: center; font-size: 13px; color: #8a8aa3; margin-bottom: 12px; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (max-width: 520px) {
  #app { padding: 16px; border-radius: 22px; min-height: 580px; }
  h1 { font-size: 28px; }
  .letter-big { font-size: 88px; }
  .prompt-letter { font-size: 78px; }
  .prompt-emoji { font-size: 56px; }
  .word-emoji { font-size: 52px; }
  .word-text { font-size: 26px; }
  .opt { min-height: 76px; }
  .letter-opt { font-size: 36px; }
  .big-btn { padding: 26px 8px; font-size: 20px; }
  .menu-btn { font-size: 18px; padding: 14px 18px; }
  .question-text { font-size: 19px; }
  .mic-btn { width: 76px; height: 76px; font-size: 34px; }
  .write-wrap { height: 250px; }
  .write-guide { font-size: 150px; }
  .mem-card .back { font-size: 32px; }
  .mem-card .back.kind-l { font-size: 36px; }
  .prog-grid { grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .prog-cell { font-size: 16px; }
}

</style>
</head>
<body>

<div id="app" dir="rtl">

  <!-- ================= الشاشة الرئيسية ================= -->
  <section id="screen-home" class="screen active">
    <h1>🎈 لعبة الحروف 🎈</h1>
    <p class="sub">تعلّم الحروف العربية والإنجليزية باللعب والنطق والكتابة<br>
      <span style="direction:ltr;display:inline-block">Learn Arabic &amp; English Letters</span>
    </p>
    <div class="lang-btns">
      <button class="big-btn ar" data-action="lang" data-lang="ar"><span class="flag">🇸🇦</span> العربية</button>
      <button class="big-btn en" data-action="lang" data-lang="en"><span class="flag">🇬🇧</span> English</button>
    </div>
    <div class="tools">
      <span class="stars-badge">⭐ <span class="js-stars">0</span></span>
      <button class="tool-btn js-sound" data-action="toggleSound" aria-label="Sound">🔊</button>
      <button class="tool-btn js-slow" data-action="toggleSlow" aria-label="Slow speech" title="🐢">🐢</button>
    </div>
    <button class="install-btn" id="install-btn" data-action="install" hidden>📲 تثبيت التطبيق / Install</button>
    <p class="speak-hint" style="margin-top:22px">
      🔊 تأكد من رفع صوت الجهاز للاستماع إلى النطق<br>
      🎤 للتصحيح الصوتي استخدم Chrome / Edge
    </p>
  </section>

  <!-- ================= القائمة ================= -->
  <section id="screen-menu" class="screen">
    <div class="topbar">
      <button class="back-btn" data-action="home" data-t="home"></button>
      <span class="hud" id="menu-lang"></span>
    </div>
    <h2 data-t="menuTitle"></h2>
    <p class="sub" data-t="menuSub"></p>
    <div class="tools" style="margin-bottom:8px">
      <span class="stars-badge">⭐ <span class="js-stars">0</span></span>
      <button class="tool-btn js-sound" data-action="toggleSound" aria-label="Sound">🔊</button>
      <button class="tool-btn js-slow" data-action="toggleSlow" aria-label="Slow speech">🐢</button>
    </div>
    <div class="menu-grid">
      <button class="menu-btn m-learn" data-action="learn"><span class="ico">📖</span><span data-t="mLearn"></span></button>
      <button class="menu-btn m-speak" data-action="speak"><span class="ico">🎤</span><span data-t="mSpeak"></span></button>
      <button class="menu-btn m-write" data-action="write"><span class="ico">✍️</span><span data-t="mWrite"></span></button>
      <button class="menu-btn m-practice" data-action="practice"><span class="ico">✏️</span><span data-t="mPractice"></span></button>
      <button class="menu-btn m-quiz" data-action="quiz"><span class="ico">🏆</span><span data-t="mQuiz"></span></button>
      <button class="menu-btn m-memory" data-action="memory"><span class="ico">🧩</span><span data-t="mMemory"></span></button>
      <button class="menu-btn m-progress" data-action="progress"><span class="ico">🏅</span><span data-t="mProgress"></span></button>
    </div>
  </section>

  <!-- ================= التعلّم ================= -->
  <section id="screen-learn" class="screen">
    <div class="topbar">
      <button class="back-btn" data-action="menu" data-t="back"></button>
      <span class="hud" id="learn-progress">1 / 28</span>
    </div>
    <div class="strip" id="learn-strip"></div>
    <div class="letter-card" data-action="speakLearnLetter">
      <div class="letter-big" id="learn-letter">أ</div>
      <div class="letter-name" id="learn-name"></div>
    </div>
    <div class="word-card" data-action="speakLearnWord">
      <div class="word-emoji" id="learn-emoji">🦁</div>
      <div class="word-text" id="learn-word">أسد</div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="learn-prev" data-action="learnPrev" data-t="prev"></button>
      <button class="nav-btn" id="learn-next" data-action="learnNext" data-t="next"></button>
    </div>
    <p class="speak-hint" data-t="tapCard"></p>
    <div id="voice-warn" class="warn-box" hidden></div>
  </section>

  <!-- ================= النطق ================= -->
  <section id="screen-speak" class="screen">
    <div class="topbar">
      <button class="back-btn" data-action="menu" data-t="back"></button>
      <span class="hud" id="speak-hud">0 ✅ | 0 ❌</span>
    </div>
    <h2 data-t="speakTitle"></h2>
    <p class="sub" data-t="speakInst"></p>
    <div class="letter-card" data-action="speakSpeakLetter">

const QUIZ_LENGTH = 10;
const STORE_KEY = 'lettersGame.v2';

/* =========================================================
   2) الحفظ (localStorage بشكل آمن)
   ========================================================= */

function defaultSave() {
  return {
    stars: 0,
    learned: { ar: [], en: [] },
    written: { ar: [], en: [] },
    best: { ar: 0, en: 0 },
    memBest: { ar: 0, en: 0 },
    sound: true,
    slow: false,
    lang: 'ar'
  };
}

function loadSave() {
  const base = defaultSave();
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return base;
    return Object.assign(base, o);
  } catch (e) {
    return base;
  }
}

let save = loadSave();

function persist() {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) { /* التخزين غير متاح */ }
}

/* =========================================================
   3) أدوات
   ========================================================= */

const $ = (id) => document.getElementById(id);

const state = {
  lang: save.lang === 'en' ? 'en' : 'ar',
  screen: 'home',
  learnIdx: 0, speakIdx: 0, writeIdx: 0,
  speakOk: 0, speakNo: 0,
  mode: 'practice', score: 0, qNum: 0, totalQ: QUIZ_LENGTH, streak: 0,
  currentQ: null, locked: false,
  again: null, mem: null,
  penColor: '#6a11cb', strokeLen: 0
};

function letters() { return state.lang === 'ar' ? AR_LETTERS : EN_LETTERS; }
function T(key) { return UI[state.lang][key]; }
function langCode() { return state.lang === 'ar' ? 'ar-SA' : 'en-US'; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* مؤقتات تُلغى عند مغادرة الشاشة */
let timers = [];
function later(fn, ms) {
  const id = setTimeout(() => {
    timers = timers.filter((x) => x !== id);
    fn();
  }, ms);
  timers.push(id);
  return id;
}
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

/* =========================================================
   4) تطبيع النص للمقارنة
   ========================================================= */

function normalizeArabic(s) {
  return String(s)
    .replace(/[ً-ْٰـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[^ء-ي]/g, '')
    .trim();
}
function normalizeEnglish(s) { return String(s).toLowerCase().replace(/[^a-z]/g, '').trim(); }
function norm(s) { return state.lang === 'ar' ? normalizeArabic(s) : normalizeEnglish(s); }

/* =========================================================
   5) الأصوات والنطق
   ========================================================= */

let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) { /* تجاهل */ } }
  return audioCtx;
}

function tone(freq, start, dur, type, vol) {
  const ctx = getAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function sfx(name) {
  if (!save.sound) return;
  try {
    if (name === 'ok') { tone(523, 0, .14); tone(659, .12, .14); tone(784, .24, .22); }
    else if (name === 'no') { tone(220, 0, .18, 'sawtooth', .08); tone(165, .16, .25, 'sawtooth', .08); }
    else if (name === 'win') { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .22)); }
    else if (name === 'pop') { tone(640, 0, .08, 'triangle', .12); }
  } catch (e) { /* تجاهل */ }
}

let voices = [];
function loadVoices() {
  if ('speechSynthesis' in window) {
    try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
  }
}
if ('speechSynthesis' in window) {
  loadVoices();
  try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { /* تجاهل */ }
  setTimeout(loadVoices, 400);
  setTimeout(loadVoices, 1500);
}

function findVoice(code) {
  const prefix = code.slice(0, 2).toLowerCase();
  return voices.find((v) => v.lang && v.lang.toLowerCase().replace('_', '-') === code.toLowerCase()) ||
         voices.find((v) => v.lang && v.lang.toLowerCase().startsWith(prefix)) || null;
}

function stopSpeaking() {
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) { /* تجاهل */ } }
}

function speak(text, code) {
  if (!save.sound || !text || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = code || langCode();
    const v = findVoice(u.lang);
    if (v) u.voice = v;
    u.rate = save.slow ? 0.55 : 0.85;
    u.pitch = 1.1;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) { /* تجاهل */ }
}
function speakLetterOf(it) { speak(it.n); }
function speakWordOf(it) { speak(it.w); }

   6) قصاصات الاحتفال

function confetti() {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('confetti');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const parts = [];
    for (let i = 0; i < 90; i++) {
      parts.push({
        x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5,
        vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 4,
        s: 6 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
        col: 'hsl(' + Math.floor(Math.random() * 360) + ',90%,60%)'
      });
    }
    let frames = 0;
    (function step() {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        ctx.restore();
      });
      if (++frames < 150) requestAnimationFrame(step);
      else ctx.clearRect(0, 0, c.width, c.height);
    })();
  } catch (e) { /* تجاهل */ }
}

function applyLang() {
  const app = $('app');
  app.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach((el) => {
    const v = T(el.dataset.t);
    if (v !== undefined) el.innerHTML = v;
  });
  $('menu-lang').textContent = state.lang === 'ar' ? 'العربية 🇸🇦' : 'English 🇬🇧';
}

function updateStars() {
  document.querySelectorAll('.js-stars').forEach((el) => { el.textContent = save.stars; });
}
function addStars(n) {
  save.stars += n;
  persist();
  updateStars();
}

function updateToggles() {
  document.querySelectorAll('.js-sound').forEach((b) => {
    b.textContent = save.sound ? '🔊' : '🔇';
    b.classList.toggle('off', !save.sound);
  });
  document.querySelectorAll('.js-slow').forEach((b) => {
    b.classList.toggle('on', !!save.slow);
    b.classList.toggle('off', !save.slow);
  });
}

function stopAll() {
  stopSpeaking();
  stopListening();
  clearTimers();
  state.locked = false;
}

function showScreen(name) {
  if (state.screen !== name) stopAll();
  document.querySelectorAll('.screen').forEach((s) => {
    s.classList.toggle('active', s.id === 'screen-' + name);
  });
  state.screen = name;
  try { window.scrollTo(0, 0); } catch (e) { /* تجاهل */ }
}

function startLang(lang) {
  state.lang = lang;
  save.lang = lang;
  persist();
  applyLang();
  showScreen('menu');
}

function markIn(listName, letter) {
  const arr = save[listName][state.lang];
  if (arr.indexOf(letter) === -1) { arr.push(letter); persist(); return true; }
  return false;
}
function isIn(listName, letter) { return save[listName][state.lang].indexOf(letter) !== -1; }

function buildStrip() {
  const strip = $('learn-strip');
  strip.innerHTML = '';
  letters().forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'strip-btn';
    b.textContent = it.l;
    b.dataset.idx = String(i);
    b.setAttribute('aria-label', it.n);
    strip.appendChild(b);
  });
}

function refreshStrip() {
  const kids = $('learn-strip').children;
  for (let i = 0; i < kids.length; i++) {
    kids[i].classList.toggle('cur', i === state.learnIdx);
    kids[i].classList.toggle('done', isIn('learned', letters()[i].l));
  }
  const cur = kids[state.learnIdx];
  if (cur && cur.scrollIntoView) {
    try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { /* تجاهل */ }
  }
}

function startLearn() {
  state.learnIdx = 0;
  buildStrip();
  showScreen('learn');
  renderLearn(true);
  const warn = $('voice-warn');
  warn.hidden = true;
  later(() => {
    loadVoices();
    if (state.lang === 'ar' && voices.length > 0 && !findVoice('ar-SA')) {
      warn.textContent = T('noVoice');
      warn.hidden = false;
    }
  }, 600);
}

function renderLearn(auto) {
  const list = letters();
  const it = list[state.learnIdx];
  $('learn-letter').textContent = it.l;
  $('learn-name').textContent = state.lang === 'ar' ? it.n : '';
  $('learn-emoji').textContent = it.e;
  const w = $('learn-word');
  w.textContent = it.w;
  w.classList.toggle('en', state.lang === 'en');
  $('learn-progress').textContent = (state.learnIdx + 1) + ' / ' + list.length;
  $('learn-prev').disabled = state.learnIdx === 0;
  $('learn-next').disabled = state.learnIdx === list.length - 1;
  markIn('learned', it.l);
  refreshStrip();
  if (auto) speakLetterOf(it);

function learnGo(i) {
  if (i < 0 || i >= letters().length) return;
  state.learnIdx = i;
  sfx('pop');
  renderLearn(true);
}

/* =========================================================
   9) التدرب على النطق
   ========================================================= */

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

function setMicHint(text, cls) {
  const h = $('mic-hint');
  h.textContent = text;
  h.className = 'mic-hint' + (cls ? ' ' + cls : '');
}

function startSpeak() {
  state.speakOk = 0; state.speakNo = 0; state.speakIdx = 0;
  showScreen('speak');
  const warn = $('speak-warn');
  warn.hidden = !!SpeechRec;
  if (!SpeechRec) warn.textContent = T('noRec');
  $('mic-btn').disabled = !SpeechRec;
  renderSpeak();
}

function renderSpeak() {
  const it = letters()[state.speakIdx];
  $('speak-letter').textContent = it.l;
  $('speak-emoji').textContent = it.e;
  const w = $('speak-word');
  w.textContent = it.w;
  w.classList.toggle('en', state.lang === 'en');
  $('speak-hud').textContent = state.speakOk + ' ✅ | ' + state.speakNo + ' ❌';
  setMicHint(T('micIdle'), '');
  $('heard-box').innerHTML = '';
}

function startListening() {
  if (!SpeechRec) return;
  stopSpeaking();
  try {
    recognition = new SpeechRec();
    recognition.lang = langCode();
    recognition.interimResults = false;
    recognition.maxAlternatives = 6;
    recognition.continuous = false;
    recognition.onstart = () => {
      isListening = true;
      $('mic-btn').classList.add('listening');
      setMicHint(T('listening'), 'listen');
    };
    recognition.onresult = (ev) => {
      const res = ev.results[0];
      const alts = [];
      for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
      handleHeard(alts);
    };
    recognition.onerror = (ev) => {
      isListening = false;
      $('mic-btn').classList.remove('listening');
      let msg = T('micError');
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') msg = T('micDenied');
      else if (ev.error === 'no-speech') msg = T('micNoSpeech');
      setMicHint(msg, 'no');
    };
    recognition.onend = () => {
      isListening = false;
      $('mic-btn').classList.remove('listening');
    };
    recognition.start();
  } catch (e) {
    isListening = false;
    $('mic-btn').classList.remove('listening');
    setMicHint(T('micFail'), 'no');
  }
}

function stopListening() {
  if (recognition) {
    try { recognition.abort(); } catch (e) { /* تجاهل */ }
    recognition = null;
  }
  isListening = false;
  const mb = $('mic-btn');
  if (mb) mb.classList.remove('listening');
}

function isSpeechMatch(alts, it) {
  const names = [it.l, it.n, it.w].concat(it.a || []).map(norm).filter(Boolean);
  const wordN = norm(it.w);
  const nameN = norm(it.n);
  for (let i = 0; i < alts.length; i++) {
    const n = norm(alts[i]);
    if (!n) continue;
    if (names.indexOf(n) !== -1) return true;
    if (wordN.length >= 3 && n.indexOf(wordN) !== -1) return true;
    if (nameN.length >= 3 && n.indexOf(nameN) !== -1) return true;
  }
  return false;
}

function handleHeard(alts) {
  const it = letters()[state.speakIdx];
  $('heard-box').innerHTML = escapeHtml(T('heard')) + '<b>' + escapeHtml(alts[0] || '') + '</b>';
  if (isSpeechMatch(alts, it)) {
    state.speakOk++;
    addStars(1);
    sfx('ok');
    setMicHint(T('micOk'), 'ok');
  } else {
    state.speakNo++;
    sfx('no');
    setMicHint(T('micNo'), 'no');
  }
  $('speak-hud').textContent = state.speakOk + ' ✅ | ' + state.speakNo + ' ❌';
}

function speakStep(d) {
  stopListening();
  const n = letters().length;
  state.speakIdx = (state.speakIdx + d + n) % n;
  renderSpeak();
}

/* =========================================================
   10) الكتابة
   ========================================================= */

let wctx = null;
let drawing = false;
let lastPt = null;

function setupWrite() {
  const cv = $('write-canvas');
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  wctx = cv.getContext('2d');
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wctx.lineCap = 'round';
  wctx.lineJoin = 'round';
  wctx.lineWidth = 14;
  wctx.strokeStyle = state.penColor;
  state.strokeLen = 0;
}

function startWrite() {
  state.writeIdx = 0;
  showScreen('write');
  renderWrite();
}

function renderWrite() {
  const list = letters();
  const it = list[state.writeIdx];
  $('write-guide').textContent = it.l;
  $('write-progress').textContent = (state.writeIdx + 1) + ' / ' + list.length;
  $('write-hint').textContent = '';
  $('write-hint').className = 'mic-hint';
  setupWrite();
}

function canvasPoint(e) {
  const r = $('write-canvas').getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function writeStep(d) {
  const n = letters().length;
  state.writeIdx = (state.writeIdx + d + n) % n;
  renderWrite();
}

function writeDone() {
  const it = letters()[state.writeIdx];
  const hint = $('write-hint');
  if (state.strokeLen < 150) {
    hint.textContent = T('writeNeed');
    hint.className = 'mic-hint no';
    sfx('no');
    return;
  }
  const first = markIn('written', it.l);
  if (first) {
    addStars(1);
    hint.textContent = T('writeGood');
    confetti();
  } else {
    hint.textContent = T('writeAgain');
  }
  hint.className = 'mic-hint ok';
  sfx('ok');
  speakLetterOf(it);
}

function initWriteEvents() {
  const cv = $('write-canvas');
  cv.addEventListener('pointerdown', (e) => {
    if (!wctx) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* تجاهل */ }
    drawing = true;
    lastPt = canvasPoint(e);
    wctx.strokeStyle = state.penColor;
    wctx.beginPath();
    wctx.moveTo(lastPt.x, lastPt.y);
    wctx.lineTo(lastPt.x + 0.01, lastPt.y + 0.01);
    wctx.stroke();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing || !wctx) return;
    e.preventDefault();
    const p = canvasPoint(e);
    wctx.beginPath();
    wctx.moveTo(lastPt.x, lastPt.y);
    wctx.lineTo(p.x, p.y);
    wctx.stroke();
    state.strokeLen += Math.hypot(p.x - lastPt.x, p.y - lastPt.y);
    lastPt = p;
  });
  const end = () => { drawing = false; lastPt = null; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', end);

  $('write-colors').addEventListener('click', (e) => {
    const dot = e.target.closest('.color-dot');
    if (!dot) return;
    state.penColor = dot.dataset.color;
    if (wctx) wctx.strokeStyle = state.penColor;
    document.querySelectorAll('.color-dot').forEach((d) => d.classList.toggle('sel', d === dot));
    sfx('pop');
  });

  // نعيد ضبط اللوحة فقط إذا تغيّر العرض فعلًا (شريط العنوان في الجوال يغيّر الارتفاع فقط)
  let lastW = 0;
  window.addEventListener('resize', () => {
    if (state.screen !== 'write') return;
    const w = cv.getBoundingClientRect().width;
    if (Math.abs(w - lastW) > 1) { lastW = w; renderWrite(); }
  });
}

/* =========================================================
   11) التدريب والاختبار
   ========================================================= */

const QTYPES = ['wordToLetter', 'letterToWord', 'listenToLetter'];

function qHtml(key) {
  if (state.lang === 'ar') return UI.ar[key] + '<span class="en-line">' + UI.en[key] + '</span>';
  return UI.en[key];
}

function startGame(mode) {
  state.mode = mode;
  state.score = 0; state.qNum = 0; state.streak = 0;
  state.totalQ = mode === 'quiz' ? QUIZ_LENGTH : Infinity;
  showScreen('game');
  nextQuestion();
}

function updateGameHud() {
  let t = '⭐ ' + state.score;
  if (state.mode === 'quiz') t += '  |  ' + Math.min(state.qNum, state.totalQ) + '/' + state.totalQ;
  if (state.streak >= 3) t += '  🔥' + state.streak;
  $('game-hud').textContent = t;
}

function makeOptions(correct, count) {
  const others = shuffle(letters().filter((x) => x.l !== correct.l)).slice(0, count - 1);
  return shuffle([correct].concat(others));
}

function nextQuestion() {
  if (state.mode === 'quiz' && state.qNum >= state.totalQ) { finishQuiz(); return; }
  state.qNum++;
  state.locked = false;
  const fb = $('feedback');
  fb.textContent = ''; fb.className = 'feedback';
  updateGameHud();

  const ar = state.lang === 'ar';
  const target = pickRandom(letters());
  const type = pickRandom(QTYPES);
  const options = makeOptions(target, 4);
  state.currentQ = { type: type, target: target };

  const qt = $('question-text');
  const pa = $('prompt-area');
  const oa = $('options-area');
  pa.onclick = null;
  oa.innerHTML = '';

  if (type === 'wordToLetter') {
    qt.innerHTML = qHtml('qWord');
    pa.innerHTML = '<div class="prompt-emoji">' + target.e + '</div>' +
      '<div class="prompt-word' + (ar ? '' : ' en') + '">' + escapeHtml(target.w) + '</div>';
    pa.onclick = () => speakWordOf(target);
    options.forEach((o) => oa.appendChild(makeLetterBtn(o, target)));
    speakWordOf(target);
  } else if (type === 'letterToWord') {
    qt.innerHTML = qHtml('qLetter');
    pa.innerHTML = '<div class="prompt-letter">' + escapeHtml(target.l) + '</div>';
    pa.onclick = () => speakLetterOf(target);
    options.forEach((o) => oa.appendChild(makeWordBtn(o, target)));
    speakLetterOf(target);
  } else {
    qt.innerHTML = qHtml('qListen');
    pa.innerHTML = '<div class="prompt-emoji">🔊</div>' +
      '<div class="prompt-word' + (ar ? '' : ' en') + '" style="font-size:20px">' + escapeHtml(T('tapListen')) + '</div>';
    pa.onclick = () => speakLetterOf(target);
    options.forEach((o) => oa.appendChild(makeLetterBtn(o, target)));
    later(() => speakLetterOf(target), 250);
  }
}

function makeLetterBtn(it, target) {
  const b = document.createElement('button');
  b.className = 'opt letter-opt';
  b.dataset.l = it.l;
  b.textContent = it.l;
  b.addEventListener('click', () => onAnswer(b, it.l === target.l));
  return b;
}

function makeWordBtn(it, target) {
  const b = document.createElement('button');
  b.className = 'opt word-opt';
  b.dataset.l = it.l;
  b.innerHTML = '<span class="opt-emoji">' + it.e + '</span>' +
    '<span class="opt-word"' + (state.lang === 'en' ? ' style="direction:ltr"' : '') + '>' + escapeHtml(it.w) + '</span>';
  b.addEventListener('click', () => onAnswer(b, it.l === target.l));
  return b;
}

function onAnswer(btn, isCorrect) {
  if (state.locked) return;
  state.locked = true;
  const fb = $('feedback');
  const btns = Array.prototype.slice.call($('options-area').children);
  btns.forEach((b) => { b.disabled = true; });
  const target = state.currentQ.target;

  if (isCorrect) {
    btn.classList.add('correct');
    state.score++; state.streak++;
    addStars(1);
    fb.textContent = T('correct'); fb.className = 'feedback ok';
    sfx('ok');
  } else {
    btn.classList.add('wrong');
    state.streak = 0;
    btns.forEach((b) => { if (b.dataset.l === target.l) b.classList.add('correct'); });
    fb.textContent = T('wrong'); fb.className = 'feedback no';
    sfx('no');
  }
  updateGameHud();
  later(nextQuestion, 1700);
}

function showResult(o) {
  state.again = o.again;
  $('result-title').textContent = o.title;
  $('result-stars').textContent = new Array(o.stars + 1).join('⭐');
  $('result-score').textContent = o.score;
  $('result-msg').textContent = o.msg;
  showScreen('result');
  sfx('win');
  if (o.good) confetti();
  speak(o.msg.replace(/[^؀-ۿa-zA-Z0-9 !,.]/g, ''));
}

function finishQuiz() {
  const total = state.totalQ;
  const ratio = state.score / total;
  let stars = 1, msg = T('msg1');
  if (ratio >= 0.9) { stars = 3; msg = T('msg3'); }
  else if (ratio >= 0.6) { stars = 2; msg = T('msg2'); }
  if (state.score > save.best[state.lang]) { save.best[state.lang] = state.score; persist(); }
  showResult({
    title: T('quizDone'), stars: stars, score: state.score + ' / ' + total,
    msg: msg, again: () => startGame('quiz'), good: ratio >= 0.6
  });
}

/* =========================================================
   12) لعبة الذاكرة
   ========================================================= */

function startMemory() {
  const pick = shuffle(letters()).slice(0, 6);
  const cards = [];
  pick.forEach((it) => {
    cards.push({ id: it.l, kind: 'l', html: escapeHtml(it.l) });
    cards.push({ id: it.l, kind: 'e', html: it.e });
  });
  state.mem = { cards: shuffle(cards), open: [], matched: 0, moves: 0, busy: false, total: pick.length };
  showScreen('memory');

  const grid = $('mem-grid');
  grid.innerHTML = '';
  state.mem.cards.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'mem-card';
    b.dataset.i = String(i);
    b.innerHTML = '<span class="face front">❓</span><span class="face back kind-' + c.kind + '">' + c.html + '</span>';
    grid.appendChild(b);
  });
  updateMemHud();
}

function updateMemHud() {
  const m = state.mem;
  $('memory-hud').textContent = '🔁 ' + m.moves + ' ' + T('moves') + '  |  ✅ ' + m.matched + '/' + m.total;
}

function flipCard(btn) {
  const m = state.mem;
  if (!m || m.busy) return;
  if (btn.classList.contains('flipped') || btn.classList.contains('matched')) return;
  const i = Number(btn.dataset.i);
  const card = m.cards[i];
  btn.classList.add('flipped');
  sfx('pop');
  if (card.kind === 'l') {
    const it = letters().find((x) => x.l === card.id);
    if (it) speakLetterOf(it);
  }
  m.open.push(i);
  if (m.open.length < 2) return;

  m.moves++;
  const a = m.open[0], b = m.open[1];
  const ea = $('mem-grid').children[a], eb = $('mem-grid').children[b];
  if (m.cards[a].id === m.cards[b].id) {
    m.open = [];
    m.matched++;
    ea.classList.remove('flipped'); eb.classList.remove('flipped');
    ea.classList.add('matched'); eb.classList.add('matched');
    later(() => sfx('ok'), 250);
    updateMemHud();
    if (m.matched === m.total) later(finishMemory, 900);
  } else {
    m.busy = true;
    updateMemHud();
    later(() => {
      ea.classList.remove('flipped'); eb.classList.remove('flipped');
      m.open = []; m.busy = false;
    }, 900);
  }
}

function finishMemory() {
  const m = state.mem;
  const stars = m.moves <= m.total + 4 ? 3 : (m.moves <= m.total * 2 + 2 ? 2 : 1);
  addStars(stars);
  const best = save.memBest[state.lang];
  if (!best || m.moves < best) { save.memBest[state.lang] = m.moves; persist(); }
  showResult({
    title: T('memDone'), stars: stars, score: m.moves + ' ' + T('moves'),
    msg: stars === 3 ? T('msg3') : (stars === 2 ? T('msg2') : T('msg1')),
    again: startMemory, good: true
  });
}

/* =========================================================
   13) الإنجازات
   ========================================================= */

function showProgress() {
  showScreen('progress');
  renderProgress();
}

function renderProgress() {
  const list = letters();
  $('p-learned').textContent = save.learned[state.lang].length + '/' + list.length;
  $('p-written').textContent = save.written[state.lang].length + '/' + list.length;
  $('p-quiz').textContent = save.best[state.lang] + '/' + QUIZ_LENGTH;
  $('p-memory').textContent = save.memBest[state.lang] || '-';
  const grid = $('prog-grid');
  grid.innerHTML = '';
  list.forEach((it) => {
    const c = document.createElement('div');
    c.className = 'prog-cell' + (isIn('learned', it.l) ? ' learned' : '') + (isIn('written', it.l) ? ' written' : '');
    c.textContent = it.l;
    grid.appendChild(c);
  });
}

function resetProgress() {
  if (!window.confirm(T('resetConfirm'))) return;
  const keep = { sound: save.sound, slow: save.slow, lang: save.lang };
  save = Object.assign(defaultSave(), keep);
  persist();
  updateStars();
  renderProgress();
}

  resetProgress: resetProgress,

  speakSpeakLetter: () => speakLetterOf(letters()[state.speakIdx]),
  toggleMic: () => { if (isListening) stopListening(); else startListening(); },
  speakPrev: () => speakStep(-1),
  speakNext: () => speakStep(1),

  writeClear: () => { renderWrite(); },
  writeDone: writeDone,
  writePrev: () => writeStep(-1),
  writeNext: () => writeStep(1),

  toggleSound: () => {
    save.sound = !save.sound;
    persist(); updateToggles();
    if (!save.sound) stopSpeaking(); else sfx('pop');
  },
  toggleSlow: () => { save.slow = !save.slow; persist(); updateToggles(); },
  install: () => installApp()
};

let deferredPrompt = null;
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
  $('install-btn').hidden = true;
}

document.addEventListener('click', (e) => {
  const mem = e.target.closest('.mem-card');
  if (mem && state.screen === 'memory') { getAudio(); flipCard(mem); return; }

  const sb = e.target.closest('.strip-btn');
  if (sb && state.screen === 'learn') { getAudio(); learnGo(Number(sb.dataset.idx)); return; }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) { getAudio(); fn(el); }
});

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('install-btn').hidden = false;
});
window.addEventListener('appinstalled', () => { $('install-btn').hidden = true; });
window.addEventListener('beforeunload', stopAll);

/* =========================================================
   15) التشغيل
   ========================================================= */

function init() {
  applyLang();
  updateStars();
  updateToggles();
  initWriteEvents();
  if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* التثبيت اختياري */ });
    });
  }
}

init();

</script>
